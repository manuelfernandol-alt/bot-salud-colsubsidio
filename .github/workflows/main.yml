name: Monitor Cita Dra. Yuliet Cárdenas (Salud Colsubsidio)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-y-agendar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cachear navegador Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Instalar dependencias y navegador
        run: |
          pip install playwright
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Verificar disponibilidad (agenda solo con Yuliet, avisa si hay otro médico)
        env:
          COLSUBSIDIO_USER: ${{ secrets.COLSUBSIDIO_USER }}
          COLSUBSIDIO_PASS: ${{ secrets.COLSUBSIDIO_PASS }}
          AUTO_BOOK: "true"
          WINDOWS_POPUP: "false"
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
        run: python verificar_cita_colsubsidio.py

      - name: Guardar estado de cita y reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch estado_cita.json reporte_cita_colsubsidio.md
          git add estado_cita.json reporte_cita_colsubsidio.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar estado de cita Salud Colsubsidio ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi
